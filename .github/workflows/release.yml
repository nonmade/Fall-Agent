name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 可选：仓库 Settings → Secrets and variables → Actions 里配置以下四个,APK 会用正式签名;
      # 不配置也能发布,只是 APK 是 debug 签名(仍可安装、也能覆盖安装同类 debug 签名的旧版)。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # 同 CI：不装 setup-android（runner 已预装 SDK，该 action 会因废弃的 "tools" 包失败）

      # 版本一致性校验：规则是 tag = "v" + gradle.properties 的 fall.versionName
      # （防止 tag 与构建产物版本写岔；不一致直接失败，比发出去一个"版本对不上"的包便宜得多）
      - name: Verify version
        run: |
          VERSION_NAME="$(sed -n 's/^fall\.versionName=//p' gradle.properties | tr -d '\r' | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::gradle.properties 缺少 fall.versionName"
            exit 1
          fi
          if [ "v${VERSION_NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag(${GITHUB_REF_NAME}) 与 fall.versionName(${VERSION_NAME}) 不一致：本版本应打 tag v${VERSION_NAME}"
            exit 1
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          # 预发布标识（含 "-"，如 0.1.0-beta.1）→ GitHub 标为 Pre-release，不污染 Latest
          case "$VERSION_NAME" in
            *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
          esac
          echo "版本校验通过：v${VERSION_NAME}"

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/fall-release.jks
          printf 'storeFile=keystore/fall-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore/signing.properties

      # :app:assembleRelease 会连带构建并签名 :shell:assembleRelease（打进 App 内置 assets），
      # 两边签名策略一致，见 app/build.gradle.kts 与 shell/build.gradle.kts
      - name: Build APKs
        run: ./gradlew :app:assembleRelease :shell:assembleRelease --stacktrace

      # 资产带版本号（便于用户区分下载到的是哪个版本），并附 SHA256 便于校验完整性
      # 注意：独立发布的那份 shell APK 用 **release 变体**，与 App 内置的 assets/fall-shell.apk
      # 是同一个文件（哈希一致）；若发 debug 变体，手工 push 后 App 自检会判"版本不一致"再换回内置那份
      - name: Stage assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Fall-Agent-${VERSION_NAME}.apk"
          cp shell/build/outputs/apk/release/shell-release.apk "dist/Fall-Agent-shell-${VERSION_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.apk dist/SHA256SUMS.txt \
            --title "Fall-Agent v${VERSION_NAME}" \
            --generate-notes $PRERELEASE
