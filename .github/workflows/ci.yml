name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # 不装 android-actions/setup-android：runner 已预装 Android SDK 且许可已接受，
      # 该 action 会尝试安装已废弃的 "tools" 包，导致 sdkmanager 退出 1；缺失组件由 AGP 自动下载。
      # 同时构建 release 变体：release 独有的问题（lint / 内置 assets / 签名回落）在 PR 阶段就暴露，
      # 不留到打 tag 时才炸。
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :shell:assembleDebug :app:assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace